# certmanager configuration (TOP LEVEL, not under global)
certmanager-issuer:
  email: aamhamdi110101@gmail.com

# Disable monitoring
prometheus:
  install: false
grafana:
  install: false

# Disable runner
gitlab-runner:
  install: false

# Disable registry, pages, KAS
registry:
  enabled: false
pages:
  enabled: false

# NGINX Ingress
nginx-ingress:
  enabled: false

# Core GitLab configuration
gitlab:
  kas:
    enabled: false
  
  webservice:
    # env:
    #   GITLAB_MEMORY_WATCHDOG_ENABLED: "false"
    minReplicas: 1
    maxReplicas: 1
    # workerProcesses: 1

  
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    # env:
    #   GITLAB_MEMORY_WATCHDOG_ENABLED: "false"
    #   SIDEKIQ_MEMORY_KILLER_MAX_RSS: "0"
    #   SIDEKIQ_DAEMON_MEMORY_KILLER: "0"
      
  
  gitaly:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 300m
        memory: 500Mi
  
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  
  toolbox:
    backups:
      objectStorage:
        config:
          secret: dummy-backup-secret
          key: config
        backend: s3

# Global settings
global:
  hosts:
    gitlab:
      name: gitlab.64.227.66.34.nip.io
      https: false
  ingress:
    provider: traefik
    tls:
      enabled: false
    class: traefik
  kas:
    enabled: false
  gitlab-runner:
    install: false
  
  # Object storage
  minio:
    enabled: false
  appConfig:
    object_store:
      enabled: false
      connection: {}
    artifacts:
      enabled: false
      connection: {}
    lfs:
      enabled: false
      connection: {}
    uploads:
      enabled: false
      connection: {}
    packages:
      enabled: false
      connection: {}
    backups:
      bucket: dummy-bucket
      tmpBucket: dummy-tmp-bucket

# Database resources
postgresql:
  primary:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 300m

redis:
  master:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 150m
